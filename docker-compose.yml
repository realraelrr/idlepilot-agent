services:
  xianyu-main:
    build:
      context: .
    image: xianyu-autoagent:local
    container_name: xianyu-main
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    command: ["python", "main.py"]
    volumes:
      - ./data:/app/data
      - ./prompts:/app/prompts

  feishu-control-plane:
    build:
      context: .
    image: xianyu-autoagent:local
    container_name: feishu-control-plane
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      FEISHU_CALLBACK_HOST: 0.0.0.0
    command: ["python", "-m", "services.feishu_control_plane"]
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - ./data:/app/data
      - ./prompts:/app/prompts

  browser-refresh:
    build:
      context: .
      dockerfile: browser_refresh/Dockerfile
    container_name: browser-refresh
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      BROWSER_REFRESH_SHARED_SECRET: ${BROWSER_REFRESH_SHARED_SECRET:-}
      BROWSER_REFRESH_RUNTIME_STATUS_PATH: /app-runtime-data/runtime_status.json
      BROWSER_REFRESH_DEBUGGER_URL: http://127.0.0.1:9222
      BROWSER_REFRESH_SUBMIT_URL: http://feishu-control-plane:8100/internal/browser-cookie-submit
    depends_on:
      - feishu-control-plane
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      - ./data:/app-runtime-data:ro
      - browser_refresh_profile:/browser-profile
      - browser_refresh_state:/browser-state

volumes:
  browser_refresh_profile:
  browser_refresh_state:
