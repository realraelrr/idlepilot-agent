<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Xianyu Cookie Exporter</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <p class="eyebrow">Xianyu Cookie Exporter</p>
        <h1>恢复 Cookie 导出</h1>
        <span id="modeBadge" class="badge" hidden>默认推荐：运行时恢复包</span>
      </header>

      <p id="status" class="status" role="status">等待导出…</p>
      <p id="readinessSummary" class="readiness-summary" aria-live="polite"></p>
      <ul id="warnings" class="warnings" aria-live="polite"></ul>
      <textarea
        id="cookieOutput"
        class="cookie-output"
        readonly
        spellcheck="false"
        placeholder="导出的 Cookie 文本会显示在这里"
      ></textarea>

      <section class="actions">
        <button id="copyButton" type="button">复制</button>
        <button id="toggleExportModeButton" type="button" class="button button--text">诊断</button>
        <button id="retryWithoutValidationButton" type="button" class="button button--retry" hidden>忽略页面校验后重试</button>
      </section>
    </main>

    <script src="exporter.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
